<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Moment · frontend-design + accessible-animation</title>
<style>
  :root { --bg: #f6f3ec; --ink: #16130f; --muted: #6b645a; --accent: #e0592a }
  * { box-sizing: border-box; margin: 0 }
  body { background: var(--bg); color: var(--ink); font: 18px/1.5 Georgia, "Times New Roman", serif; min-height: 100vh; display: grid; place-items: center; padding: 16px }
  main { width: min(860px, 100%) }
  .eyebrow { font: 600 13px/1 system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--muted) }
  h1 { font-size: clamp(44px, 9vw, 112px); line-height: .95; letter-spacing: -.03em; margin: 18px 0 }
  h1 em { color: var(--accent); font-style: italic }
  .rule { height: 3px; background: var(--ink); transform-origin: left; margin: 26px 0 }
  p.lede { font-size: 22px; max-width: 34ch; color: var(--muted) }
  button { margin-top: 30px; font: 600 16px system-ui, sans-serif; padding: 14px 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; transition: transform .15s ease-out }
  button:active { transform: scale(.97) }               /* motion that answers the person's action */
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px }

  /* The single orchestrated moment: one page-load sequence (frontend-design) */
  @media (prefers-reduced-motion: no-preference) {
    .eyebrow { animation: fade .5s .1s both }
    h1 .w { display: inline-block; animation: rise .9s cubic-bezier(.2, .8, .2, 1) both }
    h1 .w:nth-child(2) { animation-delay: .12s } h1 .w:nth-child(3) { animation-delay: .24s } h1 .w:nth-child(4) { animation-delay: .36s }
    .rule { animation: draw 1s .6s cubic-bezier(.65, 0, .35, 1) both }
    .lede, button { animation: fade .6s 1.1s both }
  }
  /* accessible-animation tier 2: keep the fact of the transition as a short fade, drop displacement */
  @media (prefers-reduced-motion: reduce) {
    main { animation: fade .2s both }
  }
  @keyframes rise { from { transform: translateY(.6em); opacity: 0 } }
  @keyframes draw { from { transform: scaleX(0) } }
  @keyframes fade { from { opacity: 0 } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Animate Skills · CSS only</div>
  <h1><span class="w">Spend</span> <span class="w">motion</span> <span class="w">in</span> <span class="w"><em>one place.</em></span></h1>
  <div class="rule"></div>
  <p class="lede">No library, no scroll effects on every section. One deliberate page-load sequence, and reduced motion respected.</p>
  <button type="button">Install the skill</button>
</main>
<script>
  // seek harness: ?t=N pauses every CSS animation at N seconds
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) document.getAnimations().forEach((a) => { a.pause(); a.currentTime = parseFloat(t) * 1000; });
  window.__ready = true;
</script>
</body>
</html>
