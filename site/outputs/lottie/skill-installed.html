<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Installed · lottie-animation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0f1a; color: #fff; font: 18px system-ui, sans-serif }
  .box { text-align: center }
  #lottie { width: 260px; height: 260px; margin: 0 auto }
  code { background: #1d2038; padding: 6px 12px; border-radius: 8px; display: inline-block; margin-top: 8px }
  button { margin-top: 18px; padding: 10px 18px; border-radius: 999px; border: 1px solid #2a2f52; background: #151829; color: #fff; font: inherit; cursor: pointer }
</style>
</head>
<body>
<div class="box">
  <div id="lottie" role="img" aria-label="Skill installed checkmark"></div>
  <h2>Skill installed</h2>
  <code>npx skills add iart-ai/web-animation-skills</code><br>
  <button id="replay">↻ Replay</button>
</div>
<script>
  // Hand-authored Lottie (skill-installed.json): ring + check drawn with trim paths, then a pop and halo.
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const anim = lottie.loadAnimation({ container: document.getElementById("lottie"), renderer: "svg", loop: false, autoplay: false, path: "skill-installed.json" });
  const t = new URLSearchParams(location.search).get("t");
  anim.addEventListener("DOMLoaded", () => {
    if (t !== null) anim.goToAndStop(parseFloat(t) * 1000, false);   // seek harness: ?t=N seconds
    else if (reduce) anim.goToAndStop(anim.totalFrames - 1, true);     // reduced motion: static final frame, no autoplay
    else anim.playSegments([0, 90], true);
    window.__ready = true;
  });
  document.getElementById("replay").onclick = () => anim.playSegments([0, 90], true);
</script>
</body>
</html>
